server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # #730 — SSE status stream. Proxying must not buffer or cache the stream,
    # and the default 60s proxy read timeout would kill idle-but-healthy
    # connections, so SSE gets its own long-read location block.
    location /api/events/ {
        proxy_pass http://backend:5000/events/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';

        # Stream events through immediately instead of buffering them.
        proxy_buffering off;
        proxy_cache off;

        # Stay connected well beyond the client heartbeat interval
        # (default heartbeat is 25s) so idle streams are not reaped.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Disable gzip for this location; SSE is tiny and per-event latency
        # matters more than bandwidth.
        gzip off;
    }
}
